name: Update Sky UK Channel Lineup

on:
  schedule:
    # Run twice daily at 2:00 AM and 2:00 PM UTC
    - cron: "0 2,14 * * *"
  workflow_dispatch:  # Allow manual trigger

jobs:
  update-sky-lineup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and update sky.xml from knowledgejunkie
        run: |
          echo "📡 Downloading Sky UK channel lineup from knowledgejunkie repository..."
          
          # Download the original sky.xml from the source
          wget -qO public/sky.xml https://raw.githubusercontent.com/knowledgejunkie/xmltv-lineups-uk/master/sky.xml
          
          # Verify download was successful
          if [ -f public/sky.xml ] && [ -s public/sky.xml ]; then
            echo "✅ Sky lineup downloaded successfully to public/sky.xml"
            echo "📊 File size: $(wc -c < public/sky.xml) bytes"
            
            # Display first few lines as a sanity check
            echo "📺 First 5 lines of the file:"
            head -5 public/sky.xml
          else
            echo "❌ Failed to download sky.xml"
            exit 1
          fi

      - name: Validate XML structure
        run: |
          echo "🔍 Validating XML structure..."
          
          # Check if it's valid XML by looking for root element
          if grep -q "<xmltv-lineups" public/sky.xml; then
            echo "✅ Valid XML structure detected (xmltv-lineups root found)"
          else
            echo "⚠️ Warning: Could not find expected root element"
          fi
          
          # Count lineup entries
          LINEUP_COUNT=$(grep -c "<lineup-entry" public/sky.xml || echo "0")
          CHANNEL_COUNT=$(grep -c "<station" public/sky.xml || echo "0")
          
          echo "📊 Statistics:"
          echo "   - Lineup entries: $LINEUP_COUNT"
          echo "   - Channel stations: $CHANNEL_COUNT"

      - name: Update channels.md summary
        run: |
          echo "# 📺 Sky UK Channel Lineup" > public/sky-channels.md
          echo "" >> public/sky-channels.md
          echo "*This file is automatically updated from [knowledgejunkie/xmltv-lineups-uk](https://github.com/knowledgejunkie/xmltv-lineups-uk)*" >> public/sky-channels.md
          echo "" >> public/sky-channels.md
          echo "## Last Updated" >> public/sky-channels.md
          echo "- **Date:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> public/sky-channels.md
          echo "- **Source:** https://raw.githubusercontent.com/knowledgejunkie/xmltv-lineups-uk/master/sky.xml" >> public/sky-channels.md
          echo "" >> public/sky-channels.md
          
          echo "## Channel Summary" >> public/sky-channels.md
          echo "" >> public/sky-channels.md
          
          # Extract basic channel information
          LINEUP_COUNT=$(grep -c "<lineup-entry" public/sky.xml || echo "0")
          CHANNEL_COUNT=$(grep -c "<station" public/sky.xml || echo "0")
          
          echo "| Metric | Value |" >> public/sky-channels.md
          echo "|--------|-------|" >> public/sky-channels.md
          echo "| Total Lineup Entries | $LINEUP_COUNT |" >> public/sky-channels.md
          echo "| Unique Channel Stations | $CHANNEL_COUNT |" >> public/sky-channels.md
          echo "" >> public/sky-channels.md
          
          echo "## Sample Channels" >> public/sky-channels.md
          echo "" >> public/sky-channels.md
          echo "| Preset | Channel Name | Package |" >> public/sky-channels.md
          echo "|--------|-------------|---------|" >> public/sky-channels.md
          
          # Extract preset and channel name samples
          grep -A2 "<lineup-entry" public/sky.xml | grep -E "(preset|name)" | head -20 | \
          while IFS= read -r line; do
            if echo "$line" | grep -q "<preset>"; then
              preset=$(echo "$line" | sed 's/.*<preset>\(.*\)<\/preset>.*/\1/')
            fi
            if echo "$line" | grep -q "<name"; then
              name=$(echo "$line" | sed 's/.*<name[^>]*>\([^<]*\)<\/name>.*/\1/')
              echo "| $preset | $name | Free-to-air |" >> public/sky-channels.md
            fi
          done
          
          echo "" >> public/sky-channels.md
          echo "---" >> public/sky-channels.md
          echo "## Raw File Access" >> public/sky-channels.md
          echo "" >> public/sky-channels.md
          echo "The raw XML file is available at:" >> public/sky-channels.md
          echo '```' >> public/sky-channels.md
          echo "https://raw.githubusercontent.com/${{ github.repository }}/main/public/sky.xml" >> public/sky-channels.md
          echo '```' >> public/sky-channels.md

      - name: Commit and push updated files
        run: |
          git config --global user.name "Sky Lineup Bot"
          git config --global user.email "actions@github.com"
          
          # Add both the updated XML and the markdown file
          git add public/sky.xml public/sky-channels.md
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit (file already up to date)"
          else
            LINEUP_COUNT=$(grep -c "<lineup-entry" public/sky.xml || echo "0")
            git commit -m "Update sky.xml: $(date +'%Y-%m-%d') - ${LINEUP_COUNT} lineup entries"
            git push
            echo "✅ Changes committed and pushed"
            
            # Output the URLs for convenience
            echo ""
            echo "📺 Sky lineup updated successfully!"
            echo "   📄 XML file: https://raw.githubusercontent.com/${{ github.repository }}/main/public/sky.xml"
            echo "   📊 Channel list: https://raw.githubusercontent.com/${{ github.repository }}/main/public/sky-channels.md"
            echo ""
            echo "   🔗 GitHub view: https://github.com/${{ github.repository }}/blob/main/public/sky.xml"
          fi
