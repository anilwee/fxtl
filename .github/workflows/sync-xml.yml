name: Sync XML File
on:
  schedule:
    - cron: '13 13 * * *'
  workflow_dispatch:

jobs:
  download-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Download sky.xml
        run: |
          mkdir -p public
          curl -o public/sky.xml \
            https://raw.githubusercontent.com/knowledgejunkie/xmltv-lineups-uk/master/sky.xml
      
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/sky.xml
          git diff --quiet && git diff --staged --quiet || git commit -m "Update sky.xml"
          git push
