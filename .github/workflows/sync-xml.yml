name: Sync XML File
on:
  schedule:
    # Runs at 02:00 AM Auckland time (UTC+13 during daylight time)
    - cron: '13 13 * * *'
  workflow_dispatch: # Allows manual run

jobs:
  download-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # <-- THIS IS THE CRITICAL ADDITION
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}  # <-- Explicitly use the token
      
      - name: Download sky.xml
        run: |
          mkdir -p public
          curl -o public/sky.xml \
            https://raw.githubusercontent.com/knowledgejunkie/xmltv-lineups-uk/master/sky.xml
      
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/sky.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update sky.xml $(date '+%Y-%m-%d')" && git push)
