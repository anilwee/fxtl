name: Update Sky UK EPG from epgshare01

on:
  schedule:
    # Run twice daily at 2:00 AM and 2:00 PM UTC
    - cron: "0 2,14 * * *"
  workflow_dispatch:  # Allow manual trigger

jobs:
  update-sky-epg:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create public directory
        run: mkdir -p public

      - name: Download compressed EPG from epgshare01
        run: |
          echo "📡 Downloading UK EPG from epgshare01..."
          
          curl -L -o public/epg_ripper_UK1.xml.gz https://epgshare01.online/epgshare01/epg_ripper_UK1.xml.gz || \
          wget -qO public/epg_ripper_UK1.xml.gz https://epgshare01.online/epgshare01/epg_ripper_UK1.xml.gz
          
          if [ -f public/epg_ripper_UK1.xml.gz ] && [ -s public/epg_ripper_UK1.xml.gz ]; then
            echo "✅ Download successful"
            echo "📦 Compressed size: $(wc -c < public/epg_ripper_UK1.xml.gz) bytes"
          else
            echo "❌ Failed to download from primary source"
            exit 1
          fi

      - name: Decompress XML.gz to raw_epg.xml
        run: |
          echo "🔓 Decompressing XML.gz file..."
          gunzip -c public/epg_ripper_UK1.xml.gz > public/raw_epg.xml
          
          if [ -f public/raw_epg.xml ] && [ -s public/raw_epg.xml ]; then
            echo "✅ Decompression successful"
            echo "📄 Uncompressed size: $(wc -c < public/raw_epg.xml) bytes"
          else
            echo "❌ Decompression failed"
            exit 1
          fi
          
          rm -f public/epg_ripper_UK1.xml.gz

      - name: Process EPG - Create missing SD/HD pairs (only if one is missing)
        run: |
          echo "🔧 Processing EPG (creating missing SD/HD pairs)..."
          
          cat > public/process_epg.py << 'PYTHON_SCRIPT'
          import xml.etree.ElementTree as ET
          import re
          import sys
          from copy import deepcopy

          try:
              # Parse the XML file
              tree = ET.parse('public/raw_epg.xml')
              root = tree.getroot()
              
              # Handle namespace
              namespace = ''
              if root.tag.startswith('{'):
                  namespace = root.tag.split('}')[0] + '}'
                  print(f"Found namespace: {namespace}")
              
              # Define tags
              channel_tag = f"{namespace}channel" if namespace else "channel"
              programme_tag = f"{namespace}programme" if namespace else "programme"
              display_name_tag = f"{namespace}display-name" if namespace else "display-name"
              
              # Channel name replacements (clean Sky Sports etc.)
              replacements = {
                  'SkySp ': 'Sky Sports ',
                  'SkySp Main Event': 'Sky Sports Main Event',
                  'SkySp Premier League': 'Sky Sports Premier League',
                  'SkySp Football': 'Sky Sports Football',
                  'SkySp Cricket': 'Sky Sports Cricket',
                  'SkySp Golf': 'Sky Sports Golf',
                  'SkySp F1': 'Sky Sports F1',
                  'SkySp Action': 'Sky Sports Action',
                  'SkySp Arena': 'Sky Sports Arena',
                  'SkySp News': 'Sky Sports News',
                  'SkySp Mix': 'Sky Sports Mix',
                  'SkySp NFL': 'Sky Sports NFL',
                  'SkySp Racing': 'Sky Sports Racing',
                  'SkyCine': 'Sky Cinema',
                  'SkyShow': 'Sky Showcase',
                  'SkyWit': 'Sky Witness',
                  'SkyAtl': 'Sky Atlantic',
                  'SkyOne': 'Sky One',
                  'SkyTwo': 'Sky Two',
                  'SkyLiv': 'Sky Living',
              }
              
              # First pass: Clean channel names and build channel info
              channels = {}  # channel_id -> {'element', 'name', 'is_hd', 'base_name'}
              
              print("\n📺 Processing channels from source...")
              
              for channel in root.findall(channel_tag):
                  channel_id = channel.get('id', '')
                  display_name_elem = channel.find(display_name_tag)
                  
                  if display_name_elem is not None and display_name_elem.text:
                      original_name = display_name_elem.text
                      new_name = original_name
                      
                      # Apply replacements
                      for old, new in replacements.items():
                          if old in new_name:
                              new_name = new_name.replace(old, new)
                      
                      # Handle standalone "SkySp"
                      new_name = re.sub(r'^SkySp\s+', 'Sky Sports ', new_name)
                      new_name = re.sub(r'^SkySp$', 'Sky Sports', new_name)
                      new_name = re.sub(r'\s+', ' ', new_name).strip()
                      
                      # Update display name
                      display_name_elem.text = new_name
                      
                      # Determine if this is HD or SD
                      is_hd = 'HD' in new_name or 'hd' in channel_id.lower()
                      
                      # Get base name (remove HD suffix)
                      base_name = re.sub(r'\s+HD$', '', new_name, flags=re.IGNORECASE).strip()
                      
                      channels[channel_id] = {
                          'element': channel,
                          'name': new_name,
                          'is_hd': is_hd,
                          'base_name': base_name
                      }
                      
                      print(f"  {channel_id}: {new_name} {'(HD)' if is_hd else '(SD)'}")
              
              # Group channels by base name to find missing pairs
              channel_groups = {}  # base_name -> {'sd': channel_id, 'hd': channel_id}
              
              for channel_id, info in channels.items():
                  base_name = info['base_name']
                  if base_name not in channel_groups:
                      channel_groups[base_name] = {'sd': None, 'hd': None}
                  
                  if info['is_hd']:
                      channel_groups[base_name]['hd'] = channel_id
                  else:
                      channel_groups[base_name]['sd'] = channel_id
              
              # Create missing pairs
              print("\n🔍 Checking for missing SD/HD pairs...")
              channels_created = 0
              programmes_copied = 0
              
              # First, collect all programme entries
              all_programmes = list(root.findall(programme_tag))
              
              for base_name, pair in channel_groups.items():
                  has_sd = pair['sd'] is not None
                  has_hd = pair['hd'] is not None
                  
                  if has_sd and not has_hd:
                      # Source has SD only - create HD version
                      print(f"  ✨ Creating HD version for: {base_name} (SD only in source)")
                      sd_channel_id = pair['sd']
                      sd_channel_info = channels[sd_channel_id]
                      
                      # Create new HD channel ID
                      new_channel_id = f"{sd_channel_id}.hd"
                      if new_channel_id in channels:
                          # Alternative naming if conflict
                          new_channel_id = f"{base_name.replace(' ', '_')}_HD"
                      
                      # Deep copy the channel element
                      new_channel = deepcopy(sd_channel_info['element'])
                      new_channel.set('id', new_channel_id)
                      
                      # Update display name to add HD
                      display_elem = new_channel.find(display_name_tag)
                      if display_elem is not None:
                          display_elem.text = f"{display_elem.text} HD"
                      
                      root.append(new_channel)
                      channels_created += 1
                      
                      # Copy all programmes from SD to HD
                      for programme in all_programmes:
                          if programme.get('channel') == sd_channel_id:
                              new_programme = deepcopy(programme)
                              new_programme.set('channel', new_channel_id)
                              root.append(new_programme)
                              programmes_copied += 1
                      
                  elif has_hd and not has_sd:
                      # Source has HD only - create SD version
                      print(f"  ✨ Creating SD version for: {base_name} (HD only in source)")
                      hd_channel_id = pair['hd']
                      hd_channel_info = channels[hd_channel_id]
                      
                      # Create new SD channel ID
                      new_channel_id = re.sub(r'\.hd$|\.HD$', '', hd_channel_id)
                      if new_channel_id == hd_channel_id:
                          new_channel_id = f"{hd_channel_id}.sd"
                      if new_channel_id in channels:
                          new_channel_id = f"{base_name.replace(' ', '_')}_SD"
                      
                      # Deep copy the channel element
                      new_channel = deepcopy(hd_channel_info['element'])
                      new_channel.set('id', new_channel_id)
                      
                      # Update display name to remove HD
                      display_elem = new_channel.find(display_name_tag)
                      if display_elem is not None:
                          display_elem.text = re.sub(r'\s+HD$', '', display_elem.text)
                      
                      root.append(new_channel)
                      channels_created += 1
                      
                      # Copy all programmes from HD to SD
                      for programme in all_programmes:
                          if programme.get('channel') == hd_channel_id:
                              new_programme = deepcopy(programme)
                              new_programme.set('channel', new_channel_id)
                              root.append(new_programme)
                              programmes_copied += 1
                      
                  elif has_sd and has_hd:
                      # Both already exist - do nothing
                      print(f"  ✓ Both SD and HD already exist for: {base_name}")
              
              # Final statistics
              final_channel_count = len(root.findall(channel_tag))
              final_programme_count = len(root.findall(programme_tag))
              
              print(f"\n📊 Summary:")
              print(f"  Channels created: {channels_created}")
              print(f"  Programmes copied: {programmes_copied}")
              print(f"  Total channels now: {final_channel_count}")
              print(f"  Total programmes now: {final_programme_count}")
              
              # Write the processed XML
              tree.write('public/sky.xml', encoding='utf-8', xml_declaration=True)
              print("\n✅ Processed EPG written to public/sky.xml")
              
              # Save stats for later
              with open('public/stats.txt', 'w') as f:
                  f.write(f"CHANNEL_COUNT={final_channel_count}\n")
                  f.write(f"PROGRAMME_COUNT={final_programme_count}\n")
                  f.write(f"CHANNELS_CREATED={channels_created}\n")
                  f.write(f"PROGRAMMES_COPIED={programmes_copied}\n")
              
          except Exception as e:
              print(f"Error processing XML: {e}")
              import traceback
              traceback.print_exc()
              sys.exit(1)
          PYTHON_SCRIPT
          
          python3 public/process_epg.py
          
          # Load stats for later steps
          if [ -f public/stats.txt ]; then
            source public/stats.txt
            echo "CHANNEL_COUNT=$CHANNEL_COUNT" >> $GITHUB_ENV
            echo "PROGRAMME_COUNT=$PROGRAMME_COUNT" >> $GITHUB_ENV
            echo "CHANNELS_CREATED=$CHANNELS_CREATED" >> $GITHUB_ENV
            echo "PROGRAMMES_COPIED=$PROGRAMMES_COPIED" >> $GITHUB_ENV
          fi
          
          rm -f public/raw_epg.xml public/stats.txt

      - name: Final cleanup with sed
        run: |
          echo "🔧 Running additional cleanup with sed..."
          
          cp public/sky.xml public/sky.xml.bak
          
          # Apply Sky Sports replacements
          sed -i 's/SkySp /Sky Sports /g' public/sky.xml
          sed -i 's/SkySp Main Event/Sky Sports Main Event/g' public/sky.xml
          sed -i 's/SkySp Premier League/Sky Sports Premier League/g' public/sky.xml
          sed -i 's/SkySp Football/Sky Sports Football/g' public/sky.xml
          sed -i 's/SkySp Cricket/Sky Sports Cricket/g' public/sky.xml
          sed -i 's/SkySp Golf/Sky Sports Golf/g' public/sky.xml
          sed -i 's/SkySp F1/Sky Sports F1/g' public/sky.xml
          sed -i 's/SkySp Action/Sky Sports Action/g' public/sky.xml
          sed -i 's/SkySp Arena/Sky Sports Arena/g' public/sky.xml
          sed -i 's/SkySp News/Sky Sports News/g' public/sky.xml
          sed -i 's/SkySp Mix/Sky Sports Mix/g' public/sky.xml
          sed -i 's/SkySp NFL/Sky Sports NFL/g' public/sky.xml
          sed -i 's/SkySp Racing/Sky Sports Racing/g' public/sky.xml
          
          sed -i 's/SkySp\([A-Z]\)/Sky Sports \1/g' public/sky.xml
          
          rm -f public/sky.xml.bak
          echo "✅ Additional cleanup complete"

      - name: Generate channel list report
        run: |
          cat > public/sky-channels.md << 'EOF'
          # 📺 Sky UK EPG - Channel List
          
          *This EPG is automatically updated from epgshare01.online*
          
          ## Last Updated
          EOF
          
          echo "- **Date:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> public/sky-channels.md
          echo "- **Source:** https://epgshare01.online/epgshare01/epg_ripper_UK1.xml.gz" >> public/sky-channels.md
          echo "" >> public/sky-channels.md
          
          echo "## EPG Statistics" >> public/sky-channels.md
          echo "" >> public/sky-channels.md
          echo "| Metric | Value |" >> public/sky-channels.md
          echo "|--------|-------|" >> public/sky-channels.md
          echo "| Total Channels | ${{ env.CHANNEL_COUNT }} |" >> public/sky-channels.md
          echo "| Total Programmes | ${{ env.PROGRAMME_COUNT }} |" >> public/sky-channels.md
          echo "| SD/HD Channels Created | ${{ env.CHANNELS_CREATED }} |" >> public/sky-channels.md
          echo "| Programmes Copied | ${{ env.PROGRAMMES_COPIED }} |" >> public/sky-channels.md
          echo "" >> public/sky-channels.md
          
          echo "## Channel List (SD/HD Pairs)" >> public/sky-channels.md
          echo "" >> public/sky-channels.md
          echo "| Channel ID | Display Name | Type |" >> public/sky-channels.md
          echo "|------------|--------------|------|" >> public/sky-channels.md
          
          # Extract channels and identify SD/HD
          while IFS= read -r line; do
              if [[ $line =~ \<channel[[:space:]]+id=\"([^\"]+)\" ]]; then
                  channel_id="${BASH_REMATCH[1]}"
              fi
              if [[ $line =~ \<display-name\>(.*)\</display-name\> ]]; then
                  display_name="${BASH_REMATCH[1]}"
                  if [[ "$display_name" == *"HD"* ]]; then
                      type="HD"
                  else
                      type="SD"
                  fi
                  echo "| $channel_id | $display_name | $type |" >> public/sky-channels.md
              fi
          done < <(grep -E '<channel|display-name' public/sky.xml | head -100)
          
          echo "" >> public/sky-channels.md
          echo "## Raw File Access" >> public/sky-channels.md
          echo "" >> public/sky-channels.md
          echo '```' >> public/sky-channels.md
          echo "https://raw.githubusercontent.com/${{ github.repository }}/main/public/sky.xml" >> public/sky-channels.md
          echo '```' >> public/sky-channels.md

      - name: Verify sky.xml is valid
        run: |
          echo "🔍 Final verification..."
          
          if grep -qP '\x00' public/sky.xml; then
            echo "❌ ERROR: sky.xml contains binary data"
            exit 1
          else
            echo "✅ sky.xml is a valid text file - raw URL will work!"
          fi
          
          echo ""
          echo "📊 Final Statistics:"
          echo "   Total channels: ${{ env.CHANNEL_COUNT }}"
          echo "   Total programmes: ${{ env.PROGRAMME_COUNT }}"
          echo "   New channels created: ${{ env.CHANNELS_CREATED }}"

      - name: Commit and push updated files
        run: |
          git config --global user.name "EPG Update Bot"
          git config --global user.email "actions@github.com"
          
          git add public/sky.xml public/sky-channels.md
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update sky.xml EPG: $(date +'%Y-%m-%d') - ${{ env.CHANNEL_COUNT }} channels (${{ env.CHANNELS_CREATED }} new SD/HD pairs)"
            git push
            echo "✅ Changes committed and pushed"
            
            echo ""
            echo "📺 EPG updated successfully!"
            echo "   Raw XML: https://raw.githubusercontent.com/${{ github.repository }}/main/public/sky.xml"
          fi
